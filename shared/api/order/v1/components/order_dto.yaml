type: object
required:
  - order_uuid
  - user_uuid
  - part_uuids
  - total_price
  - status
properties:
  order_uuid:
    type: string
    format: uuid
    description: "Уникальный идентификатор заказа"
    example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
  user_uuid:
    type: string
    format: uuid
    description: "Уникальный идентификатор пользователя"
    example: "b2c3d4e5-f6a7-8901-bcde-f23456789012"
  part_uuids:
    type: array
    description: "Список идентификаторов деталей/компонентов заказа"
    items:
      type: string
      format: uuid
      example: "c3d4e5f6-a7b8-9012-cdef-345678901234"
  total_price:
    type: number
    format: float
    description: "Общая стоимость заказа"
    minimum: 0
    example: 123.45
  transaction_uuid:
    type: string
    format: uuid
    description: "Уникальный идентификатор транзакции"
    example: "d4e5f6a7-b8c9-0123-defg-456789012345"
  payment_method:
    $ref: ./enums/payment_method.yaml
  status:
    $ref: ./enums/order_status.yaml
